[project]
name = "chemspc"
version = "0.5.1"
authors = [
  { name="Chem", email="codechem@proton.me" },
]
description = "An open Poke PC for accessing your Pokemon across various retro Pokemon games."
readme = "README.md"
requires-python = ">=3.12.3"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/chemlibrary/chemspc"

[tool.fastapi]
entrypoint = "main:app"
